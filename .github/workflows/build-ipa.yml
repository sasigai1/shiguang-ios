name: Build unsigned IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: |
          xcodebuild -project ShiguangDiary.xcodeproj -scheme ShiguangDiary -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ShiguangDiary.app Payload/
          zip -qry ShiguangDiary-unsigned.ipa Payload
          ls -la ShiguangDiary-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ShiguangDiary-unsigned-ipa
          path: ShiguangDiary-unsigned.ipa
